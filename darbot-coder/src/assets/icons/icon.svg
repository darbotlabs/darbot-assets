<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .line { fill: none; stroke: #00FF66; stroke-width: 36; stroke-linecap: round; stroke-linejoin: round; filter:url(#glow); }
      .fill { fill: #00FF66; filter:url(#glow); }
      .txt { fill: #00FF66; font-family: "JetBrains Mono","IBM Plex Mono","DejaVu Sans Mono",monospace; font-weight: 600; letter-spacing: 2px; }
    </style>
  </defs>
  <!-- body -->
  <path class="line" d="
    M 220 330
    Q 512 120 804 330
    L 804 600
    C 770 590 744 720 668 720
    C 600 720 562 610 512 610
    C 462 610 424 720 356 720
    C 280 720 254 590 220 600
    Z" />
  <!-- closed eyes -->
  <path class="line" d="M 340 420 L 460 420" />
  <path class="line" d="M 564 420 L 684 420" />
  <!-- CLI window -->
  <rect x="380" y="520" width="264" height="188" rx="28" ry="28" class="line" />
  <!-- '>' and '_' -->
  <path class="line" d="M 444 610 L 492 560 M 444 610 L 492 660" />
  <path class="line" d="M 540 660 L 600 660" />
</svg>