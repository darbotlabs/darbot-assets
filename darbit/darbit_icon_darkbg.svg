<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="darbit logo icon on dark background" shape-rendering="geometricPrecision">

  <defs>
    <!-- Accent gradient (baseline robot pinks) -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DD255B"/>
      <stop offset="100%" stop-color="#FF2E83"/>
    </linearGradient>

    <!-- Head paint -->
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0D4EB"/>
      <stop offset="100%" stop-color="#B488DA"/>
    </linearGradient>

    <radialGradient id="headHighlight" cx="78%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Knob paint -->
    <linearGradient id="knobGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E69F2C"/>
      <stop offset="55%" stop-color="#F2B42E"/>
      <stop offset="100%" stop-color="#FDC92B"/>
    </linearGradient>

    <radialGradient id="knobHighlight" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Mouth -->
    <linearGradient id="mouthGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E1E3B"/>
      <stop offset="100%" stop-color="#19204F"/>
    </linearGradient>

    <!-- Darbot visor tokens (borrowed, geometry is re-used) -->
    <linearGradient id="visorStroke" gradientUnits="userSpaceOnUse" x1="650" y1="0" x2="1400" y2="0">
      <stop offset="0%" stop-color="#F0609E"/>
      <stop offset="55%" stop-color="#717DDE"/>
      <stop offset="100%" stop-color="#40CEF8"/>
    </linearGradient>

    <linearGradient id="visorFill" gradientUnits="userSpaceOnUse" x1="700" y1="0" x2="1350" y2="0">
      <stop offset="0%" stop-color="#1F193A"/>
      <stop offset="100%" stop-color="#19204F"/>
    </linearGradient>

    <linearGradient id="indicatorMint" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6CDFC5"/>
      <stop offset="100%" stop-color="#8BDCD4"/>
    </linearGradient>

    <linearGradient id="indicatorAmber" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCC34C"/>
      <stop offset="100%" stop-color="#F59E2E"/>
    </linearGradient>

    <!-- Optional spectrum (useful for wordmark) -->
    <linearGradient id="darbitSpectrum" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="0">
      <stop offset="0%" stop-color="#FB6685"/>
      <stop offset="22%" stop-color="#FD964C"/>
      <stop offset="50%" stop-color="#717DDE"/>
      <stop offset="78%" stop-color="#33D3F6"/>
      <stop offset="100%" stop-color="#99E6A3"/>
    </linearGradient>

    <!-- Soft shadow: subtle enough for logos -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="160" fill="#464D56"/>

  <g id="darbit-robot" filter="url(#softShadow)">
    <!-- Antenna rods + tips -->
    <rect x="149.0" y="150.0" width="26" height="240.0" rx="13" fill="url(#accentGrad)"/>
    <circle cx="162.0" cy="120" r="44" fill="url(#accentGrad)"/>

    <rect x="849.0" y="150.0" width="26" height="240.0" rx="13" fill="url(#accentGrad)"/>
    <circle cx="862.0" cy="120" r="44" fill="url(#accentGrad)"/>

    <!-- Side modules -->
    <rect x="82" y="350" width="160" height="460" rx="80" fill="url(#accentGrad)"/>
    <rect x="782" y="350" width="160" height="460" rx="80" fill="url(#accentGrad)"/>

    <!-- Head shell -->
    <rect x="182" y="260" width="660" height="660" rx="170" fill="url(#headGrad)"/>
    <rect x="182" y="260" width="660" height="660" rx="170" fill="url(#headHighlight)"/>

    <!-- Top knob -->
    <g id="knob" transform="translate(342.0,166.0)">
      <rect width="340" height="100" rx="50" fill="url(#knobGrad)"/>
      <rect width="340" height="100" rx="50" fill="url(#knobHighlight)"/>
    </g>

    <!-- Darbot visor (replaces the original eyes) -->

    <g id="darbot-visor" transform="matrix(0.863142 0 0 0.863142 -374.301 34.263)">
      <path id="darbot-visor-shape" d="M 764.94 368.63 C 804.81 365.80 843.27 368.38 881.97 369.28 C 920.83 370.19 959.94 369.42 999.10 369.02 C 1076.03 368.23 1153.13 368.88 1229.86 367.72 C 1249.83 367.42 1269.77 367.00 1289.98 369.01 C 1310.93 371.11 1332.17 375.83 1347.21 388.53 C 1362.78 401.67 1371.72 423.37 1374.48 445.00 C 1376.92 464.14 1374.52 483.23 1374.05 502.20 C 1373.08 541.09 1380.19 579.50 1373.39 618.95 C 1369.57 641.07 1361.39 663.52 1345.44 675.64 C 1330.65 686.88 1309.19 689.26 1288.22 691.19 C 1247.69 694.92 1209.01 696.99 1171.54 688.60 C 1161.23 686.30 1151.02 683.20 1141.72 678.02 C 1130.81 671.93 1121.14 662.97 1110.44 656.59 C 1093.52 646.50 1073.99 642.86 1054.13 640.66 C 1014.27 636.23 973.12 637.61 937.87 656.31 C 918.03 666.83 900.07 682.84 879.82 689.26 C 862.61 694.72 843.74 693.23 823.99 692.97 C 782.08 692.42 736.15 697.35 707.04 672.29 C 691.40 658.83 680.62 636.72 676.80 614.92 C 673.47 595.89 675.44 577.10 676.29 558.06 C 677.19 538.12 676.86 517.90 676.03 497.96 C 675.24 478.90 673.99 460.08 677.26 441.03 C 680.99 419.26 690.63 397.17 706.99 384.81 C 722.44 373.14 743.89 370.13 764.94 368.63 Z" fill="url(#visorFill)" stroke="url(#visorStroke)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

      <g id="darbot-visor-indicators">
        <rect x="730" y="422" width="75" height="75" rx="14" ry="14" fill="url(#indicatorMint)"/>
        <rect x="820" y="422" width="74" height="75" rx="14" ry="14" fill="url(#indicatorAmber)"/>
        <rect x="909" y="422" width="75" height="75" rx="14" ry="14" fill="url(#indicatorMint)"/>
      </g>
    </g>


    <!-- Mouth -->
    <rect x="397.0" y="720.0" width="230" height="140" rx="70" fill="url(#mouthGrad)"/>
  </g>

</svg>
